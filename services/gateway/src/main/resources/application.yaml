spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/product/**
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/cart/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/order/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/payment/**
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/inventory/**
            - id: shipping-service
              uri: ${SHIPPING_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/shipping/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/notification/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                - "http://localhost:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                - "*"
                allow-credentials: true
                max-age: 3600
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s

  reactor:
    context-propagation: auto

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}