spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/product/**
            - id: cart-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/cart/**
            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/order/**
            - id: payment-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/payment/**
            - id: inventory-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/inventory/**
            - id: shipping-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/shipping/**
            - id: notification-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/notification/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                - "http://localhost:5173"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                - "*"
                allow-credentials: true
                max-age: 3600
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s

server:
  port: 8080